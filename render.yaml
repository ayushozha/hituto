# Hi Tuto — Render Blueprint (native Python API + Postgres)
# https://render.com/docs/blueprint-spec
#
# Waitlist stays on InsForge (frontend @insforge/sdk). This Blueprint only
# hosts the FastAPI backend.

databases:
  - name: hituto-db
    plan: basic_256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: hituto-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: bash scripts/render_build.sh
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: hituto-db
          property: connectionString
      - key: VECTOR_STORE
        value: pgvector
      - key: AUTH_DISABLED
        value: "1"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: INSFORGE_JWT_SECRET
        sync: false
      - key: INSFORGE_BASE_URL
        sync: false
      - key: INSFORGE_API_KEY
        sync: false
