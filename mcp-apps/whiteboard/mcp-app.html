<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fdf1e7;
        font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid #e7ddd0;
        background: #fffaf3;
      }
      .topbar h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #18181b;
      }
      .topbar p {
        margin: 0;
        font-size: 12px;
        color: #71717a;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .canvas {
        min-height: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/mcp-app.tsx"></script>
  </body>
</html>
