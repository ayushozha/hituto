name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv==0.10.4
      - name: Sync locked backend dependencies
        run: uv sync --project backend --frozen --all-extras
      - name: Run linter
        run: uv run --project backend --frozen ruff check backend/app backend/tests backend/alembic
      - name: Run tests
        env:
          SKIP_PROVIDER_VALIDATION: "1"
        run: make test-backend
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        env:
          VITE_AUTH_DISABLED: "1"
        run: npm run build --prefix frontend
